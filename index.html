<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiskSieve — Disk Space Analyzer &amp; Storage Cleaner</title>
    <style>
      /* Boot loader: painted before any JS or CSS bundle loads; React replaces #root content. */
      html, body { margin: 0; height: 100%; background: #0B0D0C; }
      .boot { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font: 600 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #E8EDEA; letter-spacing: -0.01em; }
      .boot svg { width: 64px; height: 64px; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-bar { width: 120px; height: 2px; border-radius: 2px; background: #1F2422; overflow: hidden; }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #22C55E; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.55; transform: scale(0.96); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot svg, .boot-bar::after { animation: none; } }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root">
      <div class="boot" role="status" aria-label="Loading DiskSieve">
        <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <rect width="100" height="100" rx="22" fill="#121413" />
          <circle cx="50" cy="50" r="34" stroke="#22C55E" stroke-width="4.5" />
          <circle cx="50" cy="50" r="4.5" stroke="#22C55E" stroke-width="2.5" />
          <circle cx="40" cy="32" r="2.4" fill="#466854" /><circle cx="50" cy="32" r="2.4" fill="#466854" /><circle cx="60" cy="32" r="2.4" fill="#466854" />
          <circle cx="33" cy="44" r="2" fill="#378B5B" /><circle cx="67" cy="44" r="2" fill="#378B5B" />
          <circle cx="36" cy="58" r="1.6" fill="#28B262" /><circle cx="64" cy="58" r="1.6" fill="#28B262" />
          <circle cx="50" cy="70" r="1.2" fill="#22C55E" />
        </svg>
        <span>DiskSieve</span>
        <div class="boot-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
