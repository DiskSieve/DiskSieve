[workspace]
members = [
    "crates/disksieve-core",
    "crates/disksieve-cli",
    "src-tauri",
]
resolver = "2"

# Shared metadata — crates inherit it with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DiskSieve/disksieve"
homepage = "https://github.com/DiskSieve/disksieve"
authors = ["DiskSieve Contributors"]

# Single source of truth for dependency versions across the workspace.
[workspace.dependencies]
disksieve-core = { path = "crates/disksieve-core" }
bitflags = "2"
# Duplicate finder: fast content hashing (own rayon parallelism across files).
blake3 = "1.8"
rayon = "1.12"
criterion = "0.8"
fs4 = "1.1"
filesize = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Scan snapshots for Delta Mode: compact binary encoding, compressed.
postcard = { version = "1", default-features = false, features = ["use-std"] }
zstd = { version = "0.13", default-features = false }
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
thiserror = "2"
tempfile = "3"
# System Trash / Recycle Bin (`os_limited` restore on Windows and Linux).
trash = { version = "5.3", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }
ts-rs = "12"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release binaries (KPI: installer < 12 MB).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"
